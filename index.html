<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기타 치며 노래하는 하치와레 — 3D 모형</title>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<style>
  :root { --ink:#0f172a; --sub:#475569; --line:#cbd5e1; --bg:#ffffff; --panel:#f8fafc; --accent:#2f6fb0; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:24px; flex-wrap:wrap; padding:12px 20px; border-bottom:2px solid var(--accent); }
  .ttl { font-size:22px; font-weight:700; color:var(--accent); }
  .ttl span { font-size:14px; font-weight:500; color:var(--sub); margin-left:10px; }
  main { flex:1; display:flex; min-height:0; }
  #view { position:relative; flex:1; min-width:0; overflow:hidden; background:radial-gradient(ellipse at 50% 38%, #ffffff 0%, #e8eef5 100%); }
  #c { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #ov, #lb { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #tools { position:absolute; left:16px; top:14px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; max-width:calc(100% - 32px);
    background:rgba(255,255,255,.93); padding:8px 10px; border:1px solid var(--line); border-radius:6px; }
  #tools button { font:inherit; font-size:13px; padding:5px 12px; border:1.5px solid var(--ink); background:#fff; color:var(--ink); border-radius:4px; cursor:pointer; white-space:nowrap; flex:0 0 auto; }
  #tools button.on { background:var(--ink); color:#fff; }
  #tools label { font-size:13px; margin-left:8px; display:flex; align-items:center; gap:6px; white-space:nowrap; flex:0 0 auto; }
  #tools input[type=range] { width:112px; }
  .hint { pointer-events:none; }
  .hint { position:absolute; left:16px; bottom:12px; font-size:12px; color:var(--sub); }
  .lbl { position:absolute; background:#fff; border:1.5px solid var(--ink); border-radius:4px; padding:4px 9px;
    white-space:nowrap; pointer-events:auto; cursor:grab; user-select:none; touch-action:none; }
  .lbl .t { font-size:13px; font-weight:600; }
  .lbl .s { font-size:11px; color:var(--sub); margin-top:1px; }
  .lbl.sel { border-color:var(--accent); box-shadow:0 0 0 2px rgba(47,111,176,.25); }
  aside { width:366px; flex:none; background:var(--panel); border-left:1px solid var(--line); padding:16px 18px; overflow-y:auto; }
  aside h2 { margin:0 0 4px; font-size:19px; }
  .comp { font-size:13px; color:var(--sub); margin:0 0 12px; line-height:1.6; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th, td { padding:6px 5px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--sub); font-weight:600; background:#eef2f7; }
  tr.part { cursor:pointer; } tr.part:hover td { background:#eef2f7; }
  tr.part.on td { background:#dbe8ff; font-weight:600; }
  .sw { display:inline-block; width:11px; height:11px; border:1px solid #94a3b8; border-radius:2px; vertical-align:-1px; margin-right:5px; }
  .beat { margin:12px 0 0; padding:9px 11px; background:#eef2f7; border-left:3px solid var(--accent); font-size:12.5px; line-height:1.6; }
  .foot { margin-top:14px; font-size:11.5px; color:var(--sub); line-height:1.6; }
  @media (max-width: 860px) {
    header { padding:10px 14px; gap:10px; }
    .ttl { font-size:18px; }
    .ttl span { display:block; margin:2px 0 0; font-size:12px; }
    main { flex-direction:column; }
    #view { flex:none; height:min(70vh, 620px); min-height:300px; }
    aside { width:100%; flex:none; border-left:none; border-top:1px solid var(--line); padding:14px 16px; overflow-y:visible; }
    #tools { left:8px; right:8px; top:8px; max-width:none; padding:6px 8px; gap:4px;
      flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    #tools button { padding:4px 9px; font-size:12px; }
    #tools label { font-size:12px; margin-left:5px; }
    #tools input[type=range] { width:84px; }
    .hint { display:none; }
    .lbl .t { font-size:12px; } .lbl .s { font-size:10px; }
  }
  @media (max-width: 860px) and (orientation: landscape) {
    #view { height:min(82vh, 520px); }
  }
</style>
</head>

  o = o || {};

    metalness: o.metalness === undefined ? 0 : o.metalness,
    clearcoat: o.coat || 0,
    clearcoatRoughness: 0.35,

  });
}
function ellip(rx, ry, rz, m, seg) {
  const g = new THREE.SphereGeometry(1, seg || 44, Math.round((seg || 44) / 2));
  g.scale(rx, ry, rz);
  return new THREE.Mesh(g, m);
}
function cyl(rTop, rBot, h, m, seg) { return new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg || 28), m); }
function box(w, h, d, m, r) {
  if (!r) return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false, curveSegments: 10 });
  g.translate(0, 0, -d / 2);
  return new THREE.Mesh(g, m);
}
function tubeOf(pts, r, m, seg) { return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg || 44, r, 14), m); }
function lathe(loop, m, seg) {
  return new THREE.Mesh(new THREE.LatheGeometry(loop.map(p => new THREE.Vector2(p[0], p[1])), seg || 44), m);

function tag(o, key) { o.traverse(x => { if (x.isMesh) { x.castShadow = true; x.receiveShadow = true; x.userData.part = key; } }); return o; }

  for (let k = -3; k <= 3; k++) {
    let d = ((u * 180 / Math.PI + k * 1.2) % 360 + 360) % 360;
    if (d > 180) d = 360 - d;
    sum += hairRaw(d);
  }
  return (sum / 7) * RAD;
}
function capGeo(rx, ry, rz, Lfn, su, sv) {
  su = su || 140; sv = sv || 30;
  const pos = [], nor = [], idx = [];
  for (let j = 0; j <= sv; j++) for (let i = 0; i <= su; i++) {
    const u = i / su * Math.PI * 2, t = (j / sv) * Lfn(u);
    const st = Math.sin(t), ct = Math.cos(t);
    const x = rx * st * Math.sin(u), y = ry * ct, z = rz * st * Math.cos(u);
    pos.push(x, y, z);
    const n = V3(x / (rx * rx), y / (ry * ry), z / (rz * rz)).normalize();
    nor.push(n.x, n.y, n.z);
  }
  for (let j = 0; j < sv; j++) for (let i = 0; i < su; i++) {
    const a = j * (su + 1) + i, b = a + 1, c = a + su + 1, d2 = c + 1;
    idx.push(a, c, b, b, c, d2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return g;
}
/* 머리 겉면 위의 점 — u 는 앞(+Z)에서 잰 방위각, t 는 정수리에서 잰 극각 */
function onHead(u, t, out) {
  out = out || 0;
  const st = Math.sin(t), ct = Math.cos(t);
  return V3((HEAD.rx + out) * st * Math.sin(u), HEAD.y + (HEAD.ry + out) * ct, (HEAD.rz + out) * st * Math.cos(u));
}
function headNormal(u, t) {
  const p = onHead(u, t);
  return V3(p.x / (HEAD.rx * HEAD.rx), (p.y - HEAD.y) / (HEAD.ry * HEAD.ry), p.z / (HEAD.rz * HEAD.rz)).normalize();
}
function faceOut(obj, u, t, out) {
  const p = onHead(u, t, out || 0), n = headNormal(u, t);
  obj.position.copy(p); obj.lookAt(p.clone().add(n));
  return obj;
}

/* ===== 부품 ===== */
function buildStump() {
  const g = new THREE.Group();
  const side = cyl(ST_RT, ST_RB, ST_H, M.stump, 72);
  side.position.y = ST_H / 2;
  const pa = side.geometry.attributes.position;
  for (let i = 0; i < pa.count; i++) {
    if (pa.getY(i) < -ST_H / 2 + 0.01) {
      const a = Math.atan2(pa.getZ(i), pa.getX(i));
      const w = 1 + 0.032 * Math.sin(a * 5) + 0.018 * Math.sin(a * 9 + 1.1);
      pa.setX(i, pa.getX(i) * w); pa.setZ(i, pa.getZ(i) * w);
      pa.setY(i, pa.getY(i) + 1.2 * Math.sin(a * 4 + 0.6));
    }
  }
  pa.needsUpdate = true; side.geometry.computeVertexNormals();
  g.add(side);
  const top = new THREE.Mesh(new THREE.CircleGeometry(ST_RT, 64), M.stumpTop);
  top.rotation.x = -Math.PI / 2; top.position.y = ST_H + 0.08; g.add(top);
  [7, 13, 19, 25].forEach(r => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.38, 6, 72), M.ring);
    ring.rotation.x = Math.PI / 2; ring.position.set(-3, ST_H + 0.3, 2); g.add(ring);
  });
  [0.3, 0.85, 1.45, 2.05, 2.7, 3.3, 3.95, 4.55, 5.15, 5.8].forEach((a, n) => {
    const cnt = n % 3 === 0 ? 3 : 2;
    for (let k = 0; k < cnt; k++) {
      const aa = a + (k - (cnt - 1) / 2) * 0.095;
      const h = 6 + (k % 2) * 3, yc = 8 + (n % 3) * 2.6;
      const rr = ST_RB - (ST_RB - ST_RT) * (yc / ST_H);
      const gr = box(1.2, h, 0.5, M.groove);
      const dir = V3(Math.sin(aa), 0, Math.cos(aa));
      gr.position.copy(dir.clone().multiplyScalar(rr - 0.1)).setY(yc);
      gr.lookAt(gr.position.clone().add(dir));
      g.add(gr);
    }
  });
  return tag(g, 'stump');
}

function buildFeet() {
  const g = new THREE.Group();
  [-1, 1].forEach(s => {
    const f = new THREE.Group();
    f.add(ellip(4.6, 3.6, 6.6, M.skin));
    const toe = ellip(3.6, 2.9, 3.0, M.skin); toe.position.set(0, 0.3, 4.1); f.add(toe);
    f.position.set(s * 6.0, 24.4, 20.5);          // 바닥이 그루터기 윗면(21)에 닿고 몸통 아래에서 앞으로 나온다
    f.rotation.y = s * 10 * RAD; f.rotation.x = -5 * RAD;
    g.add(f);
  });
  return tag(g, 'feet');
}

function buildBody() {
  const g = new THREE.Group();
  const b = ellip(BODY.rx, BODY.ry, BODY.rz, M.skin); b.position.y = BODY.y; g.add(b);
  g.add(tubeOf([V3(-16, 30, -8), V3(-21, 32, -6), V3(-24, 35, -2), V3(-24, 38, 3)], 2.5, M.tail, 22));
  const tip = ellip(2.6, 2.6, 2.6, M.tail); tip.position.set(-24, 38.3, 3.4); g.add(tip);
  return tag(g, 'body');
}

function buildHead() {
  const g = new THREE.Group();

  return tag(g, 'head');
}

function buildHair() {
  const g = new THREE.Group();
  const cap = new THREE.Mesh(capGeo(HEAD.rx * 1.02, HEAD.ry * 1.02, HEAD.rz * 1.02, hairLimit), M.blue);
  cap.position.y = HEAD.y; g.add(cap);
  return tag(g, 'hair');
}

function buildEars() {
  const g = new THREE.Group();
  [-1, 1].forEach(s => {
    const ear = new THREE.Group();
    ear.add(lathe([[0, 0], [8.4, 0], [7.5, 2.6], [5.4, 6.4], [3.0, 10.4], [1.3, 13.0], [0, 14.0]], M.blueS, 40));
    const fold = ellip(2.3, 3.2, 0.8, M.blueDk); fold.position.set(0, 3.8, 2.6); fold.rotation.x = -14 * RAD; ear.add(fold);
    const p = onHead(s * EAR_U, EAR_T, -4);
    const n = headNormal(s * EAR_U, EAR_T);
    const dir = n.clone().multiplyScalar(0.34).add(V3(0, 1.0, 0)).normalize();
    ear.position.copy(p);
    ear.quaternion.setFromUnitVectors(V3(0, 1, 0), dir);
    g.add(ear);
  });
  return tag(g, 'ears');
}

/* 앞모습 좌표(머리 중심 기준 mm)를 머리 겉면에 붙인다 — 평면 도형을 타원면 위로 구부린다 */
function faceDecal(poly, dx0, dy0, m, out, mirror) {
  const sgn = mirror ? -1 : 1;
  const pts = poly.map(q => new THREE.Vector2(sgn * q[0], q[1]));
  const g = new THREE.ShapeGeometry(new THREE.Shape(pts), 6);
  const pos = g.attributes.position, nor = [];
  const surf = (X, Y) => {
    const k = Math.max(0.03, 1 - (X / HEAD.rx) ** 2 - (Y / HEAD.ry) ** 2);
    const Z = HEAD.rz * Math.sqrt(k);
    const n = V3(X / (HEAD.rx * HEAD.rx), Y / (HEAD.ry * HEAD.ry), Z / (HEAD.rz * HEAD.rz)).normalize();
    return { p: V3(X + n.x * out, Y + n.y * out, Z + n.z * out), n };
  };
  const base = surf(sgn * dx0, dy0);
  for (let i = 0; i < pos.count; i++) {
    const r = surf(sgn * dx0 + pos.getX(i), dy0 + pos.getY(i));
    pos.setXYZ(i, r.p.x - base.p.x, r.p.y - base.p.y, r.p.z - base.p.z);
    nor.push(r.n.x, r.n.y, r.n.z);
  }
  pos.needsUpdate = true;
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  const mesh = new THREE.Mesh(g, m);
  mesh.position.set(base.p.x, HEAD.y + base.p.y, base.p.z);
  return mesh;
}

function buildFace() {
  const g = new THREE.Group();
  [false, true].forEach(mir => {
    const e = FACE.eye, hi = FACE.eyeHi, sm = FACE.eyeSmile, br = FACE.brow, bl = FACE.blush;
    g.add(faceDecal(e.p, e.o[0], e.o[1], M.ink, 0.25, mir));
    g.add(faceDecal(hi.p, hi.o[0], hi.o[1], M.skin2, 0.55, mir));
    g.add(faceDecal(sm.p, sm.o[0], sm.o[1], M.skin2, 0.55, mir));
    g.add(faceDecal(br.p, br.o[0], br.o[1], M.ink, 0.25, mir));
    g.add(faceDecal(bl.p, bl.o[0], bl.o[1], M.blush, 0.22, mir));
    FACE.hatch.forEach((h, k) => g.add(faceDecal(h, FACE.hatchOff[k][0], FACE.hatchOff[k][1], M.hatch, 0.3, mir)));
  });
  return tag(g, 'face');
}

function buildMouth() {
  const wrap = new THREE.Group();
  const inner = new THREE.Group(); inner.name = 'mouthInner';
  const mo = FACE.mouth, tg = FACE.tongue;
  const base = faceDecal(mo.p, mo.o[0], mo.o[1], M.mouth, 0.25, false);
  const pivot = base.position.clone();
  base.position.set(0, 0, 0);
  const tongue = faceDecal(tg.p, tg.o[0], tg.o[1], M.tongue, 0.5, false);
  tongue.position.sub(pivot);
  inner.add(base); inner.add(tongue);
  inner.position.copy(pivot);
  wrap.add(inner);
  const ch = FACE.chin;
  wrap.add(faceDecal(ch.p, ch.o[0], ch.o[1], M.ink, 0.25, false));
  return tag(wrap, 'mouth');
}

function guitarOutline() {
  const p = [
    [-58, 0], [-55, 11], [-47, 23], [-35, 29.6], [-23, 30.2], [-13, 25.6], [-5, 18.6], [1, 16.4],
    [9, 18.4], [17, 23.0], [26, 25.6], [34, 24.2], [40, 19.4], [44.5, 12], [46.5, 0],
  ];
  const pts = p.map(q => new THREE.Vector2(q[0], q[1]));
  for (let i = p.length - 2; i >= 1; i--) pts.push(new THREE.Vector2(p[i][0], -p[i][1]));
  const s = new THREE.Shape(new THREE.SplineCurve(pts).getPoints(170));
  s.closePath();
  return s;
}

function buildGuitar() {
  const g = new THREE.Group();
  const FRONT = 10.1, TOPZ = FRONT + 1.6;             // 베벨까지 포함한 몸통 앞면 · 윗판 바깥면
  const bodyG = new THREE.ExtrudeGeometry(guitarOutline(), { depth: 15, bevelEnabled: true, bevelThickness: 2.6, bevelSize: 2.2, bevelSegments: 4, curveSegments: 20 });
  bodyG.translate(0, 0, -7.5);
  g.add(new THREE.Mesh(bodyG, M.bind));
  const topG = new THREE.ExtrudeGeometry(guitarOutline(), { depth: 1.6, bevelEnabled: false, curveSegments: 20 });
  topG.scale(0.955, 0.955, 1); topG.translate(0, 0, FRONT);
  g.add(new THREE.Mesh(topG, M.top));
  const backG = topG.clone(); backG.translate(0, 0, -(2 * FRONT + 1.6));
  g.add(new THREE.Mesh(backG, M.top));
  // 사운드홀과 테두리
  const hole = new THREE.Mesh(new THREE.CircleGeometry(8.4, 44), M.hole);
  hole.position.set(9, 0, TOPZ + 0.5); g.add(hole);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(8.7, 0.6, 8, 44), M.bind);
  rim.position.set(9, 0, TOPZ + 0.35); g.add(rim);
  // 브리지 — 아래 바울의 긴 홈
  const br = box(4.2, 18, 1.4, M.bind, 1.7);
  br.position.set(-27, 0, TOPZ + 0.9); br.rotation.z = -6 * RAD; g.add(br);
  // 목 · 지판 · 헤드 (X 가 길이 · Y 가 너비 · Z 가 두께)
  const neck = box(40, 11.5, 11, M.neck, 2.2);
  neck.position.set(64, 0, 5.0); g.add(neck);
  const fb = box(40, 10.6, 1.8, M.bind, 1.0);
  fb.position.set(64, 0, 11.2); g.add(fb);
  // 프렛 여섯
  for (let k = 0; k < 6; k++) {
    const fr = box(0.7, 10.4, 0.5, M.str);
    fr.position.set(50 + k * 6.2, 0, 12.1); g.add(fr);
  }
  const head = box(15, 17, 8, M.neck, 2.4);
  head.position.set(91.5, 0, 5.5); g.add(head);
  [-1, 1].forEach(s => {
    const slot = box(10, 3.4, 1.0, M.groove);
    slot.position.set(91.5, s * 4.2, 9.2); g.add(slot);
    for (let k = 0; k < 2; k++) {
      const knob = ellip(1.5, 1.5, 1.2, M.bind, 16);
      knob.position.set(87 + k * 8.5, s * 8.6, 5.5); g.add(knob);
    }
  });
  // 줄 넷 — 브리지에서 헤드까지
  for (let k = 0; k < 4; k++) {
    const st = cyl(0.32, 0.32, 120, M.str, 8);
    st.rotation.z = Math.PI / 2; st.position.set(32, -4.6 + k * 3.1, TOPZ + 1.7); g.add(st);
  }
  const wrap = new THREE.Group();
  wrap.add(g);
  wrap.scale.setScalar(GUI.s);
  wrap.position.set(GUI.x, GUI.y, GUI.z);
  wrap.rotation.set(GUI.rx, GUI.ry, GUI.rz);
  return tag(wrap, 'guitar');
}

function buildArm(side) {
  const sh = side < 0 ? V3(-17.5, 44, 5) : V3(17.5, 44, 5);
  const g = new THREE.Group(); g.position.copy(sh);
  const rel = p => p.clone().sub(sh);
  const path = side < 0
    ? [V3(0, 0, 0), rel(V3(-21, 44, 14)), rel(V3(-19, 42, 25)), rel(V3(-13, 43, 30))]
    : [V3(0, 0, 0), rel(V3(23, 44, 14)), rel(V3(30, 44, 23)), rel(V3(33, 45, 29))];
  g.add(tubeOf(path, 3.8, M.skin, 36));
  const hand = ellip(4.8, 4.2, 4.8, M.skin);
  hand.position.copy(path[path.length - 1]);
  g.add(hand);
  return tag(g, side < 0 ? 'armStrum' : 'armFret');
}

let scene, camera, renderer, controls, content, built;
const canvas = document.getElementById('c');
const ovEl = document.getElementById('ov');
const lbEl = document.getElementById('lb');

function init() {
  scene = new THREE.Scene();
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  camera = new THREE.PerspectiveCamera(22, 1, 1, 4000);
  controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true; controls.dampingFactor = 0.12;
  controls.addEventListener('change', drawOverlay);

  const key = new THREE.DirectionalLight(0xffffff, 1.05);
  key.position.set(80, 130, 115); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  const d = 110;
  key.shadow.camera.left = -d; key.shadow.camera.right = d;
  key.shadow.camera.top = d; key.shadow.camera.bottom = -d;
  key.shadow.camera.near = 20; key.shadow.camera.far = 420;
  key.shadow.bias = -0.0012;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xdfeaf6, 0.38); fill.position.set(-110, 60, 55); scene.add(fill);
  const under = new THREE.DirectionalLight(0xffffff, 0.2); under.position.set(0, -70, 35); scene.add(under);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd8dee6, 0.42));

  const sp = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.ShadowMaterial({ opacity: 0.17 }));
  sp.rotation.x = -Math.PI / 2; sp.position.y = 0.02; sp.receiveShadow = true; scene.add(sp);

  content = new THREE.Group(); scene.add(content);
  rebuild(); tools(); panel();
  addEventListener('resize', resize); resize(); setView('iso');
  animate();
}

function build() {
  const groups = [];
  groups.push({ key: 'stump', group: buildStump() });
  groups.push({ key: 'feet', group: buildFeet() });
  const body = buildBody(); groups.push({ key: 'body', group: body });
  const head = new THREE.Group();
  head.add(buildHead()); head.add(buildHair()); head.add(buildEars());
  head.add(buildFace()); head.add(buildMouth());
  groups.push({ key: 'head', group: head });
  const guitar = buildGuitar(); groups.push({ key: 'guitar', group: guitar });
  const armS = buildArm(-1); groups.push({ key: 'armStrum', group: armS });
  const armF = buildArm(1); groups.push({ key: 'armFret', group: armF });
  return { groups, head, guitar, armS, armF, body };
}

function rebuild() {
  while (content.children.length) content.remove(content.children[0]);
  built = build();
  built.groups.forEach(g => content.add(g.group));
  applySel();
  if (S.edges) addEdges();
  drawOverlay();
}

function addEdges() {
  const add = [];
  content.traverse(o => { if (o.isMesh && o.geometry) add.push(o); });
  add.forEach(o => o.add(new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 38),
    new THREE.LineBasicMaterial({ color: 0x1a1714, transparent: true, opacity: 0.4 }))));
}

function applySel() {
  content.traverse(o => {
    if (!o.isMesh) return;
    if (!o.userData.om) o.userData.om = o.material;
    if (S.sel && o.userData.part !== S.sel) {
      if (!o.userData.dm) { o.userData.dm = o.userData.om.clone(); o.userData.dm.transparent = true; o.userData.dm.opacity = 0.15; }
      o.material = o.userData.dm;
    } else o.material = o.userData.om;
  });
}

/* ===== 카메라 ===== */
/* 화면이 세로로 길면 가로가 먼저 넘친다 — 세로·가로 가운데 더 먼 쪽으로 물러난다 */
function camDist(half, halfW) {
  const t = Math.tan(camera.fov * RAD / 2);
  return Math.max(half / t, (halfW || half) / (t * Math.max(camera.aspect, 0.2)));
}
function setView(k) {
  const v = {
    iso: { t: V3(0, 52, 0), half: 62, w: 48, dir: V3(0.6, 0.3, 1).normalize() },
    front: { t: V3(0, 52, 0), half: 60, w: 46, dir: V3(0, 0.08, 1).normalize() },
    side: { t: V3(0, 52, 0), half: 62, w: 44, dir: V3(1, 0.1, 0.16).normalize() },
    face: { t: V3(0, 68, 4), half: 32, w: 26, dir: V3(0.1, 0.06, 1).normalize() },
    top: { t: V3(0, 44, 2), half: 66, w: 50, dir: V3(0, 1, 0.001).normalize() },
  }[k] || {};
  const half = v.half || 62;
  camera.position.copy(v.t.clone().add(v.dir.clone().multiplyScalar(camDist(half, v.w))));
  controls.target.copy(v.t); controls.update();
  S.view = k;
  document.querySelectorAll('#tools button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === k));
  drawOverlay();
}

let lastAspect = 0;
function resize() {
  const el = document.getElementById('view'), w = el.clientWidth, h = el.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  ovEl.setAttribute('viewBox', `0 0 ${w} ${h}`);
  if (lastAspect && Math.abs(camera.aspect - lastAspect) / lastAspect > 0.15) setView(S.view);
  lastAspect = camera.aspect;
  drawOverlay();
}

/* ===== 이름표 ===== */
const ANCH = {
  head: () => onHead(0, 42 * RAD), hair: () => onHead(150 * RAD, 50 * RAD),
  ears: () => onHead(-EAR_U, EAR_T - 16 * RAD, 11), face: () => V3(FACE.eye.o[0], HEAD.y + FACE.eye.o[1], HEAD.rz * 0.9),
  mouth: () => V3(0, HEAD.y + FACE.mouth.o[1], HEAD.rz * 0.92), body: () => V3(-18, 34, 8),
  armStrum: () => V3(-17, 32, 20), armFret: () => V3(26, 39, 20),
  guitar: () => V3(22, 42, 24), feet: () => V3(8, 25, 20), stump: () => V3(-24, 10, 22),
};
const lblOff = {};
function drawOverlay() {
  lbEl.innerHTML = ''; ovEl.innerHTML = '';
  if (!S.labels || !built) return;
  const w = ovEl.clientWidth, h = ovEl.clientHeight;
  DEV.parts.forEach(p => {
    const a = ANCH[p.key]; if (!a) return;
    const v = a().clone().project(camera);
    if (v.z > 1) return;
    const x = (v.x * 0.5 + 0.5) * w, y = (-v.y * 0.5 + 0.5) * h;
    const off = lblOff[p.key] || (lblOff[p.key] = { dx: x < w / 2 ? -124 : 104, dy: -24 });
    const el = document.createElement('div');
    el.className = 'lbl' + (S.sel === p.key ? ' sel' : '');
    el.innerHTML = `<div class="t">${p.name}</div><div class="s">${p.dim}</div>`;
    el.style.left = (x + off.dx) + 'px'; el.style.top = (y + off.dy) + 'px';
    el.onpointerdown = e => {
      el.setPointerCapture(e.pointerId);
      const sx = e.clientX, sy = e.clientY, ox = off.dx, oy = off.dy;
      el.onpointermove = m => { off.dx = ox + m.clientX - sx; off.dy = oy + m.clientY - sy; drawOverlay(); };
      el.onpointerup = () => { el.onpointermove = null; el.onpointerup = null; };
    };
    lbEl.appendChild(el);
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', x); ln.setAttribute('y1', y);
    ln.setAttribute('x2', x + off.dx + (off.dx < 0 ? el.offsetWidth : 0));
    ln.setAttribute('y2', y + off.dy + 12);
    ln.setAttribute('stroke', '#1a1714'); ln.setAttribute('stroke-width', '1.3');
    ovEl.appendChild(ln);
  });
}

/* ===== 조작 · 설명판 ===== */
function tools() {
  const t = document.getElementById('tools');
  t.innerHTML = DEV.views.map(v => `<button data-v="${v.key}">${v.label}</button>`).join('')
    + `<label><input type="checkbox" id="ck_play" ${S.play ? 'checked' : ''}> 연주</label>`
    + `<label><input type="checkbox" id="ck_notes" ${S.notes ? 'checked' : ''}> 음표</label>`
    + `<label><input type="checkbox" id="ck_lab" ${S.labels ? 'checked' : ''}> 이름표</label>`
    + `<label><input type="checkbox" id="ck_edge" ${S.edges ? 'checked' : ''}> 외곽선</label>`
    + `<label><input type="checkbox" id="ck_spin" ${S.spin ? 'checked' : ''}> 회전대</label>`
    + `<label>빠르기 <input type="range" id="rg_bpm" min="60" max="160" step="2" value="${S.bpm}"> <b id="o_bpm">${S.bpm}</b></label>`;
  t.querySelectorAll('button[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));
  t.querySelector('#ck_play').onchange = e => S.play = e.target.checked;
  t.querySelector('#ck_notes').onchange = e => { S.notes = e.target.checked; if (!S.notes) { notes.forEach(n => scene.remove(n)); notes.length = 0; } };
  t.querySelector('#ck_lab').onchange = e => { S.labels = e.target.checked; drawOverlay(); };
  t.querySelector('#ck_edge').onchange = e => { S.edges = e.target.checked; rebuild(); };
  t.querySelector('#ck_spin').onchange = e => S.spin = e.target.checked;
  t.querySelector('#rg_bpm').oninput = e => { S.bpm = +e.target.value; t.querySelector('#o_bpm').textContent = S.bpm; };
}

function panel() {
  const rows = DEV.parts.map(p => `<tr class="part${S.sel === p.key ? ' on' : ''}" data-k="${p.key}">
      <td><span class="sw" style="background:#${p.color.toString(16).padStart(6, '0')}"></span>${p.name}</td>
      <td>${p.desc}</td><td>${p.dim}</td></tr>`).join('');
  document.getElementById('side').innerHTML =
    `<h2>${DEV.title}</h2><p class="comp">${DEV.comp}</p>
     <div class="beat"><b>움직임</b> — 치는 팔이 줄을 긁고, 입이 박자에 맞춰 벌어지며, 머리와 몸통이 함께 흔들린다. 빠르기는 위 막대로 바꾼다.</div>
     <table><thead><tr><th>부품</th><th>읽은 것</th><th>크기 (mm)</th></tr></thead><tbody>${rows}</tbody></table>
     <p class="foot">비율은 그림에서 읽어 맞춘 값이고 실측 치수가 아니다. 머리 가로를 66 으로 놓고 나머지를 같은 비로 환산했다. 눈·볼·입·턱선과 가르마는 정면 참고 이미지의 윤곽을 그대로 떠서 머리 겉면에 입혔고, 몸통·팔·기타·그루터기는 영상 썸네일에서 읽었다. 그림에서 가려 보이지 않는 뒤쪽(몸통 뒷면·기타 뒷판)은 앞면 비율로 채웠다.</p>`;
  document.querySelectorAll('tr.part').forEach(tr => tr.onclick = () => {
    S.sel = S.sel === tr.dataset.k ? null : tr.dataset.k;
    applySel(); panel(); drawOverlay();
  });
}

/* ===== 움직임 ===== */
let last = performance.now(), beatAcc = 0, phase = 0;
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now(), dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (built) {
    if (S.play) {
      const bps = S.bpm / 60;
      phase += dt * bps;
      const p = phase * Math.PI * 2;
      built.armS.rotation.z = Math.sin(p) * 0.24;
      built.armS.rotation.x = Math.sin(p) * 0.07;
      built.armF.rotation.z = Math.sin(p / 2) * 0.05;
      const open = 0.45 + 0.55 * Math.max(0, Math.sin(p / 2));
      built.head.traverse(o => { if (o.name === 'mouthInner') o.scale.set(1, open, 1); });
      built.head.rotation.z = Math.sin(p / 2) * 0.04;
      built.head.rotation.x = Math.sin(p) * 0.014;
      built.body.rotation.z = Math.sin(p / 2) * 0.018;
      built.guitar.rotation.z = GUI.rz + Math.sin(p / 2) * 0.018;
      beatAcc += dt * bps;
      if (S.notes && beatAcc >= 1) { beatAcc = 0; spawnNote(); }
    }
    if (S.spin) content.rotation.y += dt * 0.5;
  }
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i]; n.userData.t += dt;
    n.position.x += n.userData.vx; n.position.y += n.userData.vy;
    n.material.opacity = Math.max(0, 1 - n.userData.t / 2.6);
    if (n.userData.t > 2.6) { scene.remove(n); notes.splice(i, 1); }
  }
  controls.update();
  renderer.render(scene, camera);
}

init();
</script>
